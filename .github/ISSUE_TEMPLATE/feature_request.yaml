name: Feature request
description: 提议一个新功能
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: 你想要的功能
      description: 描述你的想法 / 希望的效果
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: 为什么需要
      description: 使用场景 / 解决的问题

  - type: textarea
    id: extra
    attributes:
      label: 补充
      description: 例如参考的 App 截图 / 界面草图
