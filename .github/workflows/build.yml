name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DynamicIsland.Hyper.sln

      - name: Build (Release)
        run: dotnet build DynamicIsland.Hyper.sln -c Release --no-restore

      - name: Publish (win-x64)
        run: dotnet publish DynamicIsland.Hyper/DynamicIsland.Hyper.csproj -c Release -r win-x64 --self-contained false -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland.Hyper-win-x64
          path: publish
          retention-days: 14
