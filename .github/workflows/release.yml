name: release

on:
  push:
    tags: [ 'v*' ]

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (win-x64, self-contained)
        run: dotnet publish DynamicIsland.Hyper/DynamicIsland.Hyper.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path publish/* -DestinationPath DynamicIsland.Hyper-win-x64.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: DynamicIsland.Hyper-win-x64.zip
          generate_release_notes: true
